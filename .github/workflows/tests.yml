name: Tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for TODOs in committed code
        run: |
          if git diff origin/main...HEAD -- '*.swift' | grep -E "^\+.*TODO|^\+.*FIXME"; then
            echo "Warning: New TODOs or FIXMEs detected"
          fi

      - name: Check file sizes
        run: |
          find Sources -type f -name "*.swift" -size +100k -exec echo "Warning: Large file: {}" \;

      - name: Check for print statements
        run: |
          if grep -r "print(" Sources/ --include="*.swift" | grep -v "// print"; then
            echo "Warning: print() statements found in source code"
          fi

  unit-tests-macos:
    name: macOS Unit Tests
    runs-on: macos-26
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          xcodebuild build \
            -scheme SwiftOnce-Package \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests on macOS
        run: |
          set +e

          xcodebuild test \
            -scheme SwiftOnce-Package \
            -destination 'platform=macOS' \
            -only-testing:SwiftOnceTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            > test_output_macos.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output_macos.txt

          if grep -q "TEST SUCCEEDED" test_output_macos.txt; then
            echo "All unit tests passed"
            exit 0
          else
            echo ""
            echo "============================================"
            echo "MACOS UNIT TESTS FAILED"
            echo "============================================"
            echo ""

            echo "Failed Tests:"
            grep "Test Case.*failed" test_output_macos.txt || echo "  No specific test failures found in output"

            echo ""
            echo "Error Messages:"
            grep -E "error:|failed with|Assertion failed|Expected|Fatal error" test_output_macos.txt | head -20 || echo "  No error messages found"

            echo ""
            echo "Test Summary:"
            grep -E "Test Suite|Testing failed|passed with|failed with" test_output_macos.txt | tail -10 || echo "  No summary found"

            exit $TEST_EXIT_CODE
          fi

  integration-tests:
    name: CLI Integration Tests
    runs-on: macos-26
    needs: [unit-tests-macos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build CLI binary
        run: |
          xcodebuild build \
            -scheme SwiftOnceCLI \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run integration tests
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e

          xcodebuild test \
            -scheme SwiftOnce-Package \
            -destination 'platform=macOS' \
            -only-testing:SwiftOnceIntegrationTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            > test_output_integration.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output_integration.txt

          if grep -q "TEST SUCCEEDED" test_output_integration.txt; then
            echo "All integration tests passed"
            exit 0
          else
            echo ""
            echo "============================================"
            echo "CLI INTEGRATION TESTS FAILED"
            echo "============================================"
            echo ""

            echo "Failed Tests:"
            grep "Test Case.*failed" test_output_integration.txt || echo "  No specific test failures found in output"

            echo ""
            echo "Error Messages:"
            grep -E "error:|failed with|Assertion failed|Expected|Fatal error" test_output_integration.txt | head -20 || echo "  No error messages found"

            echo ""
            echo "Test Summary:"
            grep -E "Test Suite|Testing failed|passed with|failed with" test_output_integration.txt | tail -10 || echo "  No summary found"

            exit $TEST_EXIT_CODE
          fi
